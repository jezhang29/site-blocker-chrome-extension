<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Site Blocker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1><img src="icon.png" alt="">Site Blocker</h1>
    <label class="switch">
      <input type="checkbox" id="enabled">
      <span class="track"></span>
      <span>Blocking on</span>
    </label>
  </header>
  <button id="focus" class="primary"></button>

  <h2>Blocked</h2>
  <form class="add-form" id="blocked-form">
    <input type="text" placeholder="example.com" autocomplete="off">
    <button type="submit">Block</button>
  </form>
  <button id="block-current">Block current site</button>
  <p id="message" hidden></p>

  <ul class="list" id="blocked-list"></ul>
  <p class="empty" id="blocked-empty">No sites blocked.</p>

  <h2>Allowed</h2>
  <p class="hint">Stays open even when its parent domain is blocked.</p>
  <form class="add-form" id="allowed-form">
    <input type="text" placeholder="music.youtube.com" autocomplete="off">
    <button type="submit">Allow</button>
  </form>

  <ul class="list" id="allowed-list"></ul>
  <p class="empty" id="allowed-empty">No sites allowed.</p>

  <script type="module" src="popup.js"></script>
</body>
</html>
